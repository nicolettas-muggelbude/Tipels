<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="128"
   height="128"
   viewBox="0 0 128 128"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="printerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5C6BC0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3F51B5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="128" height="128" rx="20" fill="#F5F5F5"/>

  <!-- Vereinfachter Drucker -->
  <g transform="translate(70, 60)">
    <rect x="0" y="0" width="45" height="35" rx="3" fill="url(#printerGrad)"/>
    <rect x="5" y="-10" width="35" height="12" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <line x1="10" y1="-6" x2="35" y2="-6" stroke="#4A90E2" stroke-width="1"/>
    <circle cx="8" cy="8" r="3" fill="#81C784"/>
    <rect x="15" y="6" width="22" height="4" rx="1" fill="#FFFFFF" opacity="0.3"/>
  </g>

  <!-- Hühnerfuß-Spuren (größer und prominenter) -->
  <!-- Fußabdruck 1 -->
  <g transform="translate(20, 90)">
    <ellipse cx="0" cy="0" rx="3" ry="9" fill="url(#footGrad)" transform="rotate(-10)"/>
    <ellipse cx="-6" cy="2" rx="2" ry="7" fill="url(#footGrad)" transform="rotate(-35)"/>
    <ellipse cx="6" cy="2" rx="2" ry="7" fill="url(#footGrad)" transform="rotate(15)"/>
    <ellipse cx="0" cy="11" rx="2" ry="5" fill="url(#footGrad)" transform="rotate(180)"/>
  </g>

  <!-- Fußabdruck 2 -->
  <g transform="translate(38, 72)">
    <ellipse cx="0" cy="0" rx="3" ry="9" fill="url(#footGrad)" transform="rotate(-5)"/>
    <ellipse cx="-6" cy="2" rx="2" ry="7" fill="url(#footGrad)" transform="rotate(-30)"/>
    <ellipse cx="6" cy="2" rx="2" ry="7" fill="url(#footGrad)" transform="rotate(20)"/>
    <ellipse cx="0" cy="11" rx="2" ry="5" fill="url(#footGrad)" transform="rotate(180)"/>
  </g>

  <!-- Fußabdruck 3 -->
  <g transform="translate(54, 55)">
    <ellipse cx="0" cy="0" rx="3" ry="9" fill="url(#footGrad)" transform="rotate(5)"/>
    <ellipse cx="-6" cy="2" rx="2" ry="7" fill="url(#footGrad)" transform="rotate(-25)"/>
    <ellipse cx="6" cy="2" rx="2" ry="7" fill="url(#footGrad)" transform="rotate(25)"/>
    <ellipse cx="0" cy="11" rx="2" ry="5" fill="url(#footGrad)" transform="rotate(180)"/>
  </g>
</svg>
