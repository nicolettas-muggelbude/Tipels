<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="128"
   height="128"
   viewBox="0 0 128 128"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">

  <!-- Papier-Hintergrund -->
  <rect width="128" height="128" fill="#FAFAFA" rx="16"/>

  <!-- Leichter Schatten -->
  <rect width="128" height="128" fill="#F5F5F5" opacity="0.3" rx="16"/>

  <!-- Vogelfuß-Abdruck 1 (unten links) -->
  <g id="footprint1" transform="translate(35, 85)">
    <!-- Hauptzehe (mittig) -->
    <ellipse cx="0" cy="-6" rx="3.5" ry="11" fill="#3F51B5" opacity="0.9"/>

    <!-- Linke Zehe -->
    <ellipse cx="-7" cy="-5" rx="2.8" ry="8" fill="#3F51B5" opacity="0.9" transform="rotate(-25 -7 -5)"/>

    <!-- Rechte Zehe -->
    <ellipse cx="7" cy="-5" rx="2.8" ry="8" fill="#3F51B5" opacity="0.9" transform="rotate(25 7 -5)"/>

    <!-- Hintere Zehe -->
    <ellipse cx="0" cy="6" rx="2.5" ry="6" fill="#3F51B5" opacity="0.9"/>
  </g>

  <!-- Vogelfuß-Abdruck 2 (oben rechts) -->
  <g id="footprint2" transform="translate(80, 45)">
    <!-- Hauptzehe (mittig) -->
    <ellipse cx="0" cy="-6" rx="3.5" ry="11" fill="#3F51B5" opacity="0.9"/>

    <!-- Linke Zehe -->
    <ellipse cx="-7" cy="-5" rx="2.8" ry="8" fill="#3F51B5" opacity="0.9" transform="rotate(-25 -7 -5)"/>

    <!-- Rechte Zehe -->
    <ellipse cx="7" cy="-5" rx="2.8" ry="8" fill="#3F51B5" opacity="0.9" transform="rotate(25 7 -5)"/>

    <!-- Hintere Zehe -->
    <ellipse cx="0" cy="6" rx="2.5" ry="6" fill="#3F51B5" opacity="0.9"/>
  </g>
</svg>
