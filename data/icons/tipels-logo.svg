<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="256"
   height="256"
   viewBox="0 0 256 256"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">

  <!-- Papier-Hintergrund (leicht gebrochen weiß) -->
  <rect width="256" height="256" fill="#FAFAFA" rx="8"/>

  <!-- Leichter Schatten/Papier-Textur -->
  <rect width="256" height="256" fill="#F5F5F5" opacity="0.3" rx="8"/>

  <!-- Vogelfuß-Abdruck 1 (unten links) - 45° gedreht, deutlich größer -->
  <g id="footprint1" transform="translate(60, 170) rotate(45)">
    <!-- Hauptzehe (mittig, nach vorne) -->
    <ellipse cx="0" cy="-20" rx="9" ry="30" fill="#3F51B5" opacity="0.85"/>

    <!-- Linke Zehe (nach vorne-links) -->
    <ellipse cx="-20" cy="-16" rx="7" ry="24" fill="#3F51B5" opacity="0.85" transform="rotate(-25 -20 -16)"/>

    <!-- Rechte Zehe (nach vorne-rechts) -->
    <ellipse cx="20" cy="-16" rx="7" ry="24" fill="#3F51B5" opacity="0.85" transform="rotate(25 20 -16)"/>

    <!-- Hintere Zehe (nach hinten) -->
    <ellipse cx="0" cy="16" rx="6.5" ry="18" fill="#3F51B5" opacity="0.85"/>
  </g>

  <!-- Vogelfuß-Abdruck 2 (oben rechts, mehr versetzt) - 45° gedreht, deutlich größer -->
  <g id="footprint2" transform="translate(175, 75) rotate(45)">
    <!-- Hauptzehe (mittig, nach vorne) -->
    <ellipse cx="0" cy="-20" rx="9" ry="30" fill="#3F51B5" opacity="0.85"/>

    <!-- Linke Zehe (nach vorne-links) -->
    <ellipse cx="-20" cy="-16" rx="7" ry="24" fill="#3F51B5" opacity="0.85" transform="rotate(-25 -20 -16)"/>

    <!-- Rechte Zehe (nach vorne-rechts) -->
    <ellipse cx="20" cy="-16" rx="7" ry="24" fill="#3F51B5" opacity="0.85" transform="rotate(25 20 -16)"/>

    <!-- Hintere Zehe (nach hinten) -->
    <ellipse cx="0" cy="16" rx="6.5" ry="18" fill="#3F51B5" opacity="0.85"/>
  </g>

  <!-- Text "Tipels" (optional) -->
  <text x="128" y="240"
        font-family="'Ubuntu', 'Segoe UI', 'Roboto', sans-serif"
        font-size="28"
        font-weight="500"
        text-anchor="middle"
        fill="#3F51B5">
    Tipels
  </text>

  <!-- Rahmen um das Logo -->
  <rect width="256" height="256" fill="none" stroke="#3F51B5" stroke-width="3" rx="8" opacity="0.4"/>
</svg>
