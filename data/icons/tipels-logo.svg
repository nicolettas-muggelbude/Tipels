<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="256"
   height="256"
   viewBox="0 0 256 256"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">

  <!-- Papier-Hintergrund (leicht gebrochen weiß) -->
  <rect width="256" height="256" fill="#FAFAFA" rx="8"/>

  <!-- Leichter Schatten/Papier-Textur -->
  <rect width="256" height="256" fill="#F5F5F5" opacity="0.3" rx="8"/>

  <!-- Vogelfuß-Abdruck 1 (unten links) -->
  <g id="footprint1" transform="translate(65, 170)">
    <!-- Hauptzehe (mittig, nach vorne) -->
    <ellipse cx="0" cy="-10" rx="4.5" ry="14" fill="#3F51B5" opacity="0.85"/>

    <!-- Linke Zehe (nach vorne-links) -->
    <ellipse cx="-10" cy="-8" rx="3.5" ry="11" fill="#3F51B5" opacity="0.85" transform="rotate(-25 -10 -8)"/>

    <!-- Rechte Zehe (nach vorne-rechts) -->
    <ellipse cx="10" cy="-8" rx="3.5" ry="11" fill="#3F51B5" opacity="0.85" transform="rotate(25 10 -8)"/>

    <!-- Hintere Zehe (nach hinten) -->
    <ellipse cx="0" cy="8" rx="3" ry="8" fill="#3F51B5" opacity="0.85"/>
  </g>

  <!-- Vogelfuß-Abdruck 2 (oben rechts, leicht versetzt) -->
  <g id="footprint2" transform="translate(155, 90)">
    <!-- Hauptzehe (mittig, nach vorne) -->
    <ellipse cx="0" cy="-10" rx="4.5" ry="14" fill="#3F51B5" opacity="0.85"/>

    <!-- Linke Zehe (nach vorne-links) -->
    <ellipse cx="-10" cy="-8" rx="3.5" ry="11" fill="#3F51B5" opacity="0.85" transform="rotate(-25 -10 -8)"/>

    <!-- Rechte Zehe (nach vorne-rechts) -->
    <ellipse cx="10" cy="-8" rx="3.5" ry="11" fill="#3F51B5" opacity="0.85" transform="rotate(25 10 -8)"/>

    <!-- Hintere Zehe (nach hinten) -->
    <ellipse cx="0" cy="8" rx="3" ry="8" fill="#3F51B5" opacity="0.85"/>
  </g>

  <!-- Text "Tipels" (optional, kann entfernt werden) -->
  <text x="128" y="240"
        font-family="'Ubuntu', 'Segoe UI', 'Roboto', sans-serif"
        font-size="28"
        font-weight="500"
        text-anchor="middle"
        fill="#3F51B5">
    Tipels
  </text>
</svg>
