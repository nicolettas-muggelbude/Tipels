<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="256"
   height="256"
   viewBox="0 0 256 256"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="printerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="footprintGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5C6BC0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3F51B5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hintergrund-Kreis -->
  <circle cx="128" cy="128" r="120" fill="#F5F5F5" opacity="0.3"/>

  <!-- Drucker-Symbol (vereinfacht) -->
  <g id="printer" transform="translate(148, 140)">
    <!-- Drucker-Gehäuse -->
    <rect x="0" y="0" width="80" height="60" rx="4" fill="url(#printerGradient)"/>
    <!-- Papier-Ausgang -->
    <rect x="10" y="-15" width="60" height="20" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <!-- Papier mit Zeilen -->
    <line x1="18" y1="-10" x2="62" y2="-10" stroke="#4A90E2" stroke-width="1.5"/>
    <line x1="18" y1="-5" x2="55" y2="-5" stroke="#4A90E2" stroke-width="1.5"/>
    <!-- Drucker-Details -->
    <circle cx="15" cy="15" r="4" fill="#81C784"/>
    <rect x="25" y="12" width="40" height="6" rx="1" fill="#FFFFFF" opacity="0.3"/>
    <!-- Papierfach unten -->
    <rect x="5" y="52" width="70" height="8" rx="2" fill="#2C3E50" opacity="0.3"/>
  </g>

  <!-- Hühnerfuß-Abdrücke (Pfad zum Drucker) -->
  <!-- Fußabdruck 1 (unten links) -->
  <g id="footprint1" transform="translate(30, 180)">
    <!-- Hauptzehe (mittig) -->
    <ellipse cx="0" cy="0" rx="4" ry="12" fill="url(#footprintGradient)" transform="rotate(-10)"/>
    <!-- Linke Zehe -->
    <ellipse cx="-8" cy="2" rx="3" ry="10" fill="url(#footprintGradient)" transform="rotate(-35)"/>
    <!-- Rechte Zehe -->
    <ellipse cx="8" cy="2" rx="3" ry="10" fill="url(#footprintGradient)" transform="rotate(15)"/>
    <!-- Hinterzehe -->
    <ellipse cx="0" cy="15" rx="2.5" ry="6" fill="url(#footprintGradient)" transform="rotate(180)"/>
  </g>

  <!-- Fußabdruck 2 -->
  <g id="footprint2" transform="translate(65, 150)">
    <ellipse cx="0" cy="0" rx="4" ry="12" fill="url(#footprintGradient)" transform="rotate(-5)"/>
    <ellipse cx="-8" cy="2" rx="3" ry="10" fill="url(#footprintGradient)" transform="rotate(-30)"/>
    <ellipse cx="8" cy="2" rx="3" ry="10" fill="url(#footprintGradient)" transform="rotate(20)"/>
    <ellipse cx="0" cy="15" rx="2.5" ry="6" fill="url(#footprintGradient)" transform="rotate(180)"/>
  </g>

  <!-- Fußabdruck 3 -->
  <g id="footprint3" transform="translate(95, 125)">
    <ellipse cx="0" cy="0" rx="4" ry="12" fill="url(#footprintGradient)" transform="rotate(5)"/>
    <ellipse cx="-8" cy="2" rx="3" ry="10" fill="url(#footprintGradient)" transform="rotate(-25)"/>
    <ellipse cx="8" cy="2" rx="3" ry="10" fill="url(#footprintGradient)" transform="rotate(25)"/>
    <ellipse cx="0" cy="15" rx="2.5" ry="6" fill="url(#footprintGradient)" transform="rotate(180)"/>
  </g>

  <!-- Fußabdruck 4 -->
  <g id="footprint4" transform="translate(125, 105)">
    <ellipse cx="0" cy="0" rx="4" ry="12" fill="url(#footprintGradient)" transform="rotate(10)"/>
    <ellipse cx="-8" cy="2" rx="3" ry="10" fill="url(#footprintGradient)" transform="rotate(-20)"/>
    <ellipse cx="8" cy="2" rx="3" ry="10" fill="url(#footprintGradient)" transform="rotate(30)"/>
    <ellipse cx="0" cy="15" rx="2.5" ry="6" fill="url(#footprintGradient)" transform="rotate(180)"/>
  </g>

  <!-- Text "Tipels" -->
  <text x="128" y="240" font-family="'Ubuntu', 'Segoe UI', sans-serif" font-size="32" font-weight="600" text-anchor="middle" fill="#3F51B5">
    Tipels
  </text>
</svg>
