[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tipels"
version = "0.1.0"
description = "Einfache Einrichtung von Druckern und Scannern unter Linux"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Tipels Contributors"}
]
keywords = ["printer", "scanner", "cups", "sane", "brother", "linux", "setup"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Printing",
    "Topic :: System :: Hardware",
    "Environment :: X11 Applications :: GTK",
]

dependencies = [
    # HINWEIS: PyGObject und dbus-python NICHT hier aufführen!
    # Diese werden über System-Pakete installiert (python3-gi, python3-dbus)
    "click>=8.1.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.7.0",
    "pylint>=2.17.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
]

qt = [
    "PyQt6>=6.5.0",
]

[project.urls]
Homepage = "https://github.com/[username]/Tipels"
Documentation = "https://github.com/[username]/Tipels/blob/main/docs"
Repository = "https://github.com/[username]/Tipels"
Issues = "https://github.com/[username]/Tipels/issues"
Changelog = "https://github.com/[username]/Tipels/blob/main/CHANGELOG.md"

[project.scripts]
tipels = "tipels.__main__:main"

[project.gui-scripts]
tipels-gui = "tipels.gui.gtk.main_window:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tipels*"]
exclude = ["tests*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pylint.main]
max-line-length = 100
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=src/tipels --cov-report=html --cov-report=term"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
