<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="128"
   height="128"
   viewBox="0 0 128 128"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">

  <!-- Papier-Hintergrund -->
  <rect width="128" height="128" fill="#FAFAFA" rx="16"/>

  <!-- Leichter Schatten -->
  <rect width="128" height="128" fill="#F5F5F5" opacity="0.3" rx="16"/>

  <!-- Vogelfuß-Abdruck 1 (unten links) - 45° gedreht, deutlich größer -->
  <g id="footprint1" transform="translate(32, 88) rotate(45)">
    <!-- Hauptzehe (mittig) -->
    <ellipse cx="0" cy="-14" rx="7" ry="22" fill="#3F51B5" opacity="0.9"/>

    <!-- Linke Zehe -->
    <ellipse cx="-15" cy="-11" rx="5.5" ry="18" fill="#3F51B5" opacity="0.9" transform="rotate(-25 -15 -11)"/>

    <!-- Rechte Zehe -->
    <ellipse cx="15" cy="-11" rx="5.5" ry="18" fill="#3F51B5" opacity="0.9" transform="rotate(25 15 -11)"/>

    <!-- Hintere Zehe -->
    <ellipse cx="0" cy="12" rx="5" ry="14" fill="#3F51B5" opacity="0.9"/>
  </g>

  <!-- Vogelfuß-Abdruck 2 (oben rechts, mehr versetzt) - 45° gedreht, deutlich größer -->
  <g id="footprint2" transform="translate(90, 38) rotate(45)">
    <!-- Hauptzehe (mittig) -->
    <ellipse cx="0" cy="-14" rx="7" ry="22" fill="#3F51B5" opacity="0.9"/>

    <!-- Linke Zehe -->
    <ellipse cx="-15" cy="-11" rx="5.5" ry="18" fill="#3F51B5" opacity="0.9" transform="rotate(-25 -15 -11)"/>

    <!-- Rechte Zehe -->
    <ellipse cx="15" cy="-11" rx="5.5" ry="18" fill="#3F51B5" opacity="0.9" transform="rotate(25 15 -11)"/>

    <!-- Hintere Zehe -->
    <ellipse cx="0" cy="12" rx="5" ry="14" fill="#3F51B5" opacity="0.9"/>
  </g>

  <!-- Rahmen um das Icon -->
  <rect width="128" height="128" fill="none" stroke="#3F51B5" stroke-width="4" rx="16" opacity="0.4"/>
</svg>
